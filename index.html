<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="icon" type="image/x-icon" href="/favicon.ico"> -->
    <title>Spotify - Web Player : Music for everyone!</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utility.css">

</head>

<body>
    <div class="container flex bg-black">
        <!-- Left - container -->
        <div class="left bg-black">
            <div class="home bg-grey rounded m-1 p-1">
                <div class="logo p-1">
                    <img class="invert" width="114" src="images/logo.svg" alt="logo">
                    <img class="invert close-left-btn" src="images/close.svg" alt="">

                </div>
                <ul>
                    <li><img class="invert" src="images/home.svg" alt="home">Home</li>
                    <li><img class="invert" src="images/search.svg" alt="search">Search</li>
                </ul>
            </div>
            <div class="library bg-grey rounded m-1 p-1">
                <div class="heading">
                    <img class="invert" src="images/playlist.svg" alt="playlist">
                    <h2>Your Library</h2>
                </div>
                <div class="songList">
                    <ul>
                    </ul>
                </div>


                <div class="footer m-1 p-1 flex">
                    <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
                    <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
                    <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>
                </div>
            </div>


        </div>
        <!-- Right - container -->
        <div class="right bg-grey rounded">
            <div class="header ">
                <div class="nav">
                    <div class="humburger ">
                        <img class="humburgerIcon invert" src="images/hamburger.svg" alt="nav">

                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>
                <div class="buttons">
                    <button class="signup-btn">Sign Up</button>
                    <button class="login-btn">Login</button>
                </div>
            </div>
            <div class="spotifyPlaylists">
                <h2>Spotify Playlists</h2>
                <div id="cardContainer">
                    <!-- <div data-folder="cs" class="card">
                        <div class="play">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                                xmlns:xlink="http://www.w3.org/2000/svg">
                                <path d="M5 20V4L19 12L5 20Z" stroke="#141B34" stroke-width="1.5"
                                    stroke-linejoin="round" fill="#000" />
                            </svg>
                        </div>
                        <img src="images/cover.jpg" alt="">
                        <h2>Song Name</h2>
                        <p>Hits to boost your mood and fill you with happiness</p>
                    </div> -->

                </div>

                <div class="playbar flex items-center">

                    <div class="seekbar">
                        <div class="circle">
                        </div>
                    </div>

                    <div class="abovebar">
                        <div class="songinfo">
                        </div>
                        <div class="songbuttons">
                            <img id="previous" width="30px" src="images/prevsong.svg" alt="prevsong">
                            <img id="play" width="30px" src="images/play.svg" alt="play">
                            <img id="next" width="30px" src="images/nextsong.svg" alt="nextsong">
                        </div>
                        <div class="timeVol">
                            <div class="songtime">
                            </div>
                            <div class="volume">
                                <img width="25px" src="images/volume.svg" alt="volume icon">
                                <div class="volRange">
                                    <input class="range" type="range" name="volume">
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
